<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jezero Rover Agent</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <strong>MARS ROVER AGENT</strong>
        <span id="clock"></span>
        <span class="spacer"></span>
        <button id="playBtn">Pause</button>
        <label>Speed <select id="speedSel"><option value="1">1×</option><option value="60">60×</option><option value="600" selected>600×</option><option value="3600">3600×</option><option value="14400">14400×</option></select></label>
        <label>Camera <select id="camSel"><option value="orbit">Orbit</option><option value="follow">Follow</option></select></label>
        <label>Local time <input id="timeSlider" type="range" min="0" max="24" step="0.05" value="8" /></label>
        <label>Dust τ <input id="tauSlider" type="range" min="0.2" max="4" step="0.05" value="0.6" /></label>
        <span id="envReadout"></span>
      </header>
      <div id="view">
        <div id="hud" class="panel"></div>
        <div id="eye" class="panel">
          <div class="eyehead">
            <strong>ROVER EYE</strong>
            <span class="tabs">
              <button data-view="rgb" class="on">Camera</button>
              <button data-view="depth">Depth</button>
              <button data-view="truth" title="Ground truth, for evaluation only">Truth</button>
            </span>
            <button id="snapBtn" title="Take an image now">Capture</button>
          </div>
          <canvas id="eyeCanvas" width="640" height="480"></canvas>
          <div id="eyeInfo">no image yet</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

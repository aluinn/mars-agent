<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jezero Rover Agent</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <strong>MARS ROVER AGENT</strong>
        <span id="clock"></span>
        <span class="spacer"></span>
        <label>Local time <input id="timeSlider" type="range" min="0" max="24" step="0.05" value="13" /></label>
        <label>Dust τ <input id="tauSlider" type="range" min="0.2" max="4" step="0.05" value="0.6" /></label>
        <span id="envReadout"></span>
      </header>
      <div id="view"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: accuracy
    attributes:
      label: Accuracy
      description: This project is explicit about what is real data and what is approximated.
      options:
        - label: If this adds data, I can name its source and licence.
        - label: I am willing to help build or review it.
